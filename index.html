<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Plan — 道路計画デザインツール</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="20" height="20"><rect width="24" height="24" rx="6" fill="#0d99ff"/><path d="M7 19c0-6 10-6 10-14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    <input id="projName" spellcheck="false" aria-label="プロジェクト名">
  </div>
  <div class="tb-group">
    <button class="ibtn" data-act="undo" title="元に戻す (Ctrl+Z)"></button>
    <button class="ibtn" data-act="redo" title="やり直す (Ctrl+Shift+Z)"></button>
  </div>
  <div class="spacer"></div>
  <div class="tb-group">
    <button class="tbtn" data-act="new">新規</button>
    <button class="tbtn" data-act="open">開く</button>
    <div class="menu">
      <button class="tbtn primary" data-act="menu-export">書き出し ▾</button>
      <div class="menu-pop" id="exportMenu" hidden>
        <button data-act="export-pdf">PDF（平面図＋線形計算書）</button>
        <button data-act="export-json">プロジェクト (.json)</button>
        <button data-act="export-geojson">GeoJSON（緯度経度）</button>
        <button data-act="export-csv">線形計算書 (.csv)</button>
        <button data-act="export-dxf">DXF（ローカル座標 m）</button>
      </div>
    </div>
    <button class="ibtn" data-act="help" title="ヘルプ (?)"></button>
  </div>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
  <input type="file" id="fileImage" accept="image/*" hidden>
</header>

<aside id="left"></aside>

<main id="stage">
  <div id="map"></div>
  <div id="hint" hidden></div>
  <div id="toolbar"></div>
  <div id="status"></div>
  <div id="zoomctl">
    <button data-act="zoom-out" title="縮小">−</button><span id="zoomLabel"></span><button data-act="zoom-in" title="拡大">＋</button>
  </div>
  <div id="toasts"></div>
</main>

<aside id="right"></aside>

<div id="print"></div>

<div id="modal" hidden><div class="modal-card"></div></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/geom.js"></script>
<script src="js/rules.js"></script>
<script src="js/app.js"></script>
<script src="js/panels.js"></script>
<script src="js/report.js"></script>
</body>
</html>
