<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Plan — 道路計画デザインツール</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <img src="img/icon-64.png" width="22" height="22" alt="">
    <input id="projName" spellcheck="false" aria-label="プロジェクト名">
  </div>
  <div class="tb-group">
    <button class="ibtn" data-act="undo" title="元に戻す (Ctrl+Z)"></button>
    <button class="ibtn" data-act="redo" title="やり直す (Ctrl+Shift+Z)"></button>
  </div>
  <div class="tb-group">
    <button class="tbtn v3btn" data-act="view3d" title="3D で表示（地形・計画高・切盛のり面）。高画質のスクリーンショットも撮れます"></button>
    <button class="tbtn v3btn" data-act="traffic" title="交通量の予測: 計画道路の整備あり・なしで交通量と混雑度を比べます"></button>
  </div>
  <div class="spacer"></div>
  <div class="tb-group">
    <button class="tbtn" data-act="new">新規</button>
    <button class="tbtn" data-act="open">開く</button>
    <div class="menu">
      <button class="tbtn primary" data-act="menu-export">書き出し ▾</button>
      <div class="menu-pop" id="exportMenu" hidden>
        <button data-act="export-pdf">PDF（平面図＋線形計算書）</button>
        <button data-act="export-json">プロジェクト (.json)</button>
        <button data-act="export-geojson">GeoJSON（緯度経度）</button>
        <button data-act="export-csv">線形計算書 (.csv)</button>
        <button data-act="export-dxf">DXF（ローカル座標 m）</button>
        <button data-act="tr-export">交通量の予測結果 (.csv)</button>
      </div>
    </div>
    <button class="ibtn" data-act="help" title="ヘルプ (?)"></button>
  </div>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
  <input type="file" id="fileImage" accept="image/*" hidden>
  <input type="file" id="fileTraffic" accept=".csv,.tsv,.txt,.json,.geojson" multiple hidden>
</header>

<aside id="left"></aside>

<main id="stage">
  <div id="map"></div>
  <div id="hint" hidden></div>
  <div id="toolbar"></div>
  <div id="status"></div>
  <div id="zoomctl">
    <button data-act="zoom-out" title="縮小">−</button><span id="zoomLabel"></span><button data-act="zoom-in" title="拡大">＋</button>
  </div>
  <div id="toasts"></div>
  <div id="vdock" hidden></div>
</main>

<aside id="right"></aside>

<div id="print"></div>

<div id="modal" hidden><div class="modal-card"></div></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/geom.js"></script>
<script src="js/rules.js"></script>
<script src="js/trafficmodel.js"></script>
<script src="js/traffic.js"></script>
<script src="js/app.js"></script>
<script src="js/trafficui.js"></script>
<script src="js/panels.js"></script>
<script src="js/report.js"></script>
<script src="js/search.js"></script>
<script src="js/xsec.js"></script>
<script src="js/view3d.js"></script>
</body>
</html>
